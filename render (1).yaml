services:
  - type: web
    name: greenxtrades-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python greenxtrades_bot.py
    envVars:
      # You must set these values in the Render dashboard or during blueprint import
      - key: TELEGRAM_BOT_TOKEN
        value: ''
      - key: ADMIN_ID
        value: ''